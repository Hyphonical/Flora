<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="1024" height="1024">
  <title>Flora</title>
  <defs>
    <!-- Single 60° wedge: 1 plump rounded petal + 1 smooth rounded dip -->
    <path id="petal" d="
      M 64 64
      L 57.5 52.74
      C 59.5 51.59, 59.2 49.5, 57.2 44.5
      C 54.5 37.8, 57.5 33, 64 33
      C 70.5 33, 73.5 37.8, 70.8 44.5
      C 68.8 49.5, 68.5 51.59, 70.5 52.74
      Z
    "/>

    <!-- Mask to punch a clean transparent hole in the exact center -->
    <mask id="center-hole">
      <rect width="128" height="128" fill="#ffffff"/>
      <circle cx="64" cy="64" r="5.5" fill="#000000"/>
    </mask>
  </defs>

  <!-- Rounded Square Surface Tile + Border -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="#1c1c1c" stroke="#313131" stroke-width="4"/>

  <!-- Thick Outer Circle ($ACCENT - Sage) -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="#afb97a" stroke-width="6.5"/>

  <!-- Exact same petal rotated 6 times at 60° intervals ($HEAD - Cream) -->
  <g fill="#ffffd4" stroke="#ffffd4" stroke-width="0.4" stroke-linejoin="round" mask="url(#center-hole)">
    <use href="#petal"/>
    <use href="#petal" transform="rotate(60 64 64)"/>
    <use href="#petal" transform="rotate(120 64 64)"/>
    <use href="#petal" transform="rotate(180 64 64)"/>
    <use href="#petal" transform="rotate(240 64 64)"/>
    <use href="#petal" transform="rotate(300 64 64)"/>
  </g>
</svg>